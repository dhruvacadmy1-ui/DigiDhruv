<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author }}">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- SEO -->
    {% seo %}
    {% feed_meta %}
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar Header -->
        <aside class="sidebar">
            <header>
                <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
                <p>{{ site.description }}</p>
                
                <!-- Navigation -->
                <nav class="site-nav">
                    <ul>
                        <li><a href="{{ '/' | relative_url }}">🏠 Home</a></li>
                        <li><a href="{{ '/about' | relative_url }}">ℹ️ About</a></li>
                        <li><a href="https://github.com/{{ site.github_username }}/{{ site.github_repo }}" target="_blank">📚 GitHub</a></li>
                    </ul>
                </nav>
            </header>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <article>
                {% if page.title %}
                    <h1>{{ page.title }}</h1>
                {% endif %}
                
                {{ content }}
            </article>

            <!-- Footer -->
            <footer class="site-footer">
                <hr>
                <p>&copy; 2026 {{ site.author }}. All rights reserved.</p>
                <p><small>Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a></small></p>
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
